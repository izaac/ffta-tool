[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ffta-tool"
version = "0.1.0"
description = "Final Fantasy Tactics Advance (GBA) Save Diagnostic and Patching CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Izaac Zavaleta", email = "izaac@linux.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Games/Entertainment",
]

[project.scripts]
ffta-tool = "ffta_tool:main"

[project.optional-dependencies]
dev = [
    "pymarkdownlnt>=0.9.29",
    "ruff>=0.8.0",
]

[tool.setuptools]
py-modules = ["ffta_tool", "mappings"]
packages = ["core", "support"]

[tool.setuptools.package-data]
"*" = ["*.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
